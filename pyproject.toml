[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asgi-function-profile"
version = "0.1.0.dev0"
description = "Experimental ordinary-function execution profile for ASGI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
django = ["Django>=5.2,<5.3"]
graphene = ["Django>=5.2,<5.3", "graphene-django>=3.2,<4", "graphql-core>=3.2,<3.3"]
strawberry = ["Django>=5.2,<5.3", "strawberry-graphql>=0.327,<0.328", "graphql-core>=3.2,<3.3"]
gunicorn = ["gunicorn>=23", "uvicorn-worker>=0.3", "uvicorn>=0.30"]
gevent = ["gevent>=25.9.1", "gunicorn>=23", "uvicorn-worker>=0.3", "uvicorn>=0.30"]

[dependency-groups]
test = ["websockets>=15", "psutil>=7", "sentry-sdk==2.38.0", "redis>=5,<6"]

[project.scripts]
asgi-function = "asgi_function_profile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asgi_function_profile"]
